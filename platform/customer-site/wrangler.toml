name = "customer-store-api"
main = "src/index.js"
compatibility_date = "2026-10-30"

[vars]
# Exact public frontend origin, e.g. https://my-store.pages.dev
ALLOWED_ORIGIN = "https://REPLACE-WITH-YOUR-PAGES-DOMAIN.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "customer-store-db"
database_id = "REPLACE-WITH-YOUR-D1-ID"
